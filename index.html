<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bio Link</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/100" alt="Profile Picture" class="avatar">
    <h1>Your Name</h1>
    <p class="tagline">Aspiring Developer | Tech Enthusiast</p>
    
    <div class="links">
      <a href="https://github.com" target="_blank" class="btn">GitHub</a>
      <a href="https://linkedin.com" target="_blank" class="btn">LinkedIn</a>
      <a href="https://twitter.com" target="_blank" class="btn">Twitter</a>
      <a href="mailto:your-email@example.com" class="btn">Contact Me</a>
    </div>
  </div>
</body>
</html>
